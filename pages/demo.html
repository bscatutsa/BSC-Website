<!DOCTYPE html>
<html lang="en">


<!------ important links & webname ------>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point System Demo - Business Student Council</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script defer src="../scripts/layout.js"></script>
    <script defer src="../scripts/script.js"></script>
    <script defer src="../scripts/dataParser.js"></script>
    <script defer src="../scripts/demo.js"></script>

    <link rel="icon" type="image/png" href="../images/favicon.png">
</head>

<!------ page layout ------>
<body class="demo-page">

<header>

    <!-- NAV (unchanged structure) -->
    <div id="site-nav"></div>

</header>


    <!-- small demo-specific styles -->
    <style>
        .visually-hidden {
            position: absolute !important;
            height: 1px;
            width: 1px;
            overflow: hidden;
            clip: rect(1px, 1px, 1px, 1px);
            white-space: nowrap;
            border: 0;
            padding: 0;
        }

        .section-container {
            padding: 3rem 0;
            background: #f7f9fc;
        }

        .dashboard-section {
            padding-bottom: 0.75rem;
        }

        .dashboard-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--bsc-primary);
        }

        .card-section {
            background-color: white;
            border-radius: 18px;
            padding: 2.5rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
            margin-bottom: 2.5rem;
            border: 1px solid var(--bsc-light-gray);
        }

        .soft-section {
            background-color: var(--bsc-soft-blue);
        }

        .lookup-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin: 1rem 0;
        }

        .lookup-input {
            flex: 1;
            border-radius: 30px;
            padding: 0.75rem 1.25rem;
            border: 1px solid rgba(0, 0, 0, 0.15);
            font-size: 0.95rem;
            background: white;
        }

        .lookup-input:focus {
            outline: none;
            border-color: var(--bsc-primary);
            box-shadow: 0 0 0 3px rgba(var(--bsc-primary-rgb), 0.15);
        }

        .lookup-button {
            border-radius: 30px;
            padding: 0.65rem 1.5rem;
        }

        .demo-tagline {
            font-size: 0.95rem;
            color: var(--clr-text-muted);
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .demo-label {
            font-size: 0.86rem;
            font-weight: 600;
            color: var(--bsc-accent);
            margin-top: 0.35rem;
        }

        .demo-value {
            font-size: 0.95rem;
            margin-bottom: 0.35rem;
        }

        .demo-value.points {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--bsc-primary);
        }

        .demo-status-pill {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: var(--bsc-light-gray);
            color: var(--bsc-primary);
        }

        .demo-message {
            font-size: 0.85rem;
            margin-top: 0.35rem;
            color: var(--clr-text-muted);
        }

        .demo-buttons-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .demo-small-btn {
            padding: 0.45rem 1rem;
            border-radius: 999px;
            border: 1px solid var(--bsc-accent);
            background: var(--bsc-accent);
            color: white;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .chart-toggle {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .chart-toggle-track {
            position: relative;
            background-color: var(--bsc-light-gray);
            border-radius: 999px;
            width: 220px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.5rem;
            cursor: pointer;
        }

        .chart-toggle-knob {
            position: absolute;
            width: 110px;
            height: 32px;
            background-color: white;
            border-radius: 999px;
            top: 3px;
            left: 3px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            transition: all 0.25s ease-in-out;
        }

        .chart-toggle-option {
            flex: 1;
            text-align: center;
            color: var(--bsc-primary);
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 2;
            user-select: none;
        }

        .chart-toggle-option.active {
            color: var(--bsc-accent);
        }

        .chart-container {
            width: 420px;
            max-width: 100%;
            margin: 1rem auto 0 auto;
        }

        .chart-container canvas {
            width: 100% !important;
            height: auto !important;
        }

        .events-box {
            background: white;
            border: 1px solid var(--bsc-light-gray);
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
            margin-top: 1.25rem;
        }

        .event-list {
            background: #f8fafc;
        }

        .leaderboard-section h2 {
            color: var(--bsc-primary);
            font-size: 1.8rem;
            margin: 0;
        }

        .leader-sub {
            font-size: 0.95rem;
            opacity: 0.65;
            margin-top: 0.35rem;
            margin-bottom: 1rem;
        }

        .leaderboard-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem 1.5rem 3rem 1.5rem;
        }

        .podium {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 2rem;
            margin: 3rem 0;
        }

        .podium-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 180px;
            padding: 1.5rem 1rem;
            border-radius: 20px;
            background: #f8fafc;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease;
        }

        .podium-card:hover {
            transform: translateY(-6px);
        }

        .podium-card.first {
            height: 220px;
            background: linear-gradient(to bottom, rgba(var(--bsc-primary-rgb), 0.08), white);
        }

        .podium-card.second {
            height: 190px;
        }

        .podium-card.third {
            height: 170px;
        }

        .leader-rank {
            font-size: 1.9rem;
            font-weight: 700;
            margin-right: 0.75rem;
            color: var(--bsc-primary);
        }

        .leader-rank.gold { color: #D4AF37; }
        .leader-rank.silver { color: #B0B0B0; }
        .leader-rank.bronze { color: #CD7F32; }

        .podium-name {
            margin-top: 0.8rem;
            font-weight: 600;
            text-align: center;
        }

        .podium-points {
            margin-top: 0.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--bsc-primary);
        }

        .rank-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .rank-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 1.5rem;
            border-radius: 16px;
            background: #f8fafc;
            transition: all 0.2s ease;
        }

        .rank-row:hover {
            background: rgba(var(--bsc-primary-rgb), 0.05);
        }

        .rank-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .rank-number {
            font-weight: 600;
            opacity: 0.6;
        }

        .rank-name {
            font-weight: 600;
        }

        .rank-points {
            font-weight: 700;
            color: var(--bsc-primary);
        }

        @media (max-width: 900px) {
            .section-container {
                padding: 2rem 0;
            }

            .card-section {
                padding: 1.5rem;
            }

            .lookup-row {
                flex-direction: column;
                align-items: stretch;
            }

            .lookup-button {
                width: 100%;
            }

            .member-wrapper {
                flex-direction: column;
            }

            .podium {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
                margin: 1.5rem 0;
            }

            .podium-card,
            .podium-card.first,
            .podium-card.second,
            .podium-card.third {
                width: 100%;
                height: auto;
                min-height: 0;
            }

            .podium-card.first {
                order: 1;
            }

            .podium-card.second {
                order: 2;
            }

            .podium-card.third {
                order: 3;
            }

            .leaderboard-container {
                padding: 1rem 0.75rem 2rem 0.75rem;
            }
        }
    </style>

    <section class="section-container dashboard-section">
        <div class="container">
            <h2 class="dashboard-title hidden">Member Point Dashboard</h2>
        </div>
    </section>

    <!-- MAIN DEMO CONTENT -->
    <section class="section-container">
        <div class="container">

            <!-- lookup + member card -->
            <section class="card-section lookup-section hidden">
                <h2>Member Lookup</h2>
                <p class="demo-tagline">
                    Enter your <b>myUTSAID</b>
                    (<i>For example:</i> <b>zwv390</b>).
                </p>

                <div class="lookup-row">
                    <label for="utsaIdInput" class="visually-hidden">myUTSA ID</label>
                    <input type="text" id="utsaIdInput" class="lookup-input" aria-label="myUTSA ID" placeholder="Enter myUTSA ID (ex: abc123)">
                    <button id="lookupBtn" type="button" class="rect-btn lookup-button">Lookup</button>
                </div>

                <div id="lookupMessage" class="demo-message"></div>

                <hr class="sub-hr" style="margin: 1.25em 0;">

                <div id="memberCard" style="display:none;">

                    <!-- BIG OUTER WRAPPER -->
                    <div class="member-wrapper">
                
                        <!-- LEFT: PROFILE BOX -->
                        <div class="member-box left-box">
                            <div class="demo-label">Name</div>
                            <div class="demo-value" id="memberName">—</div>
                            
                            <div class="demo-label">Membership Type</div>
                            <div id="membershipTierBadge"></div>
                
                            <div class="demo-label">Status</div>
                            <div class="demo-value">
                                <span id="memberStatus" class="demo-status-pill">—</span>
                            </div>
                            <div>   </div>
                
                            <div class="demo-label">Total Points</div>
                            <div class="demo-value points" id="memberPoints">0</div>
                        </div>
                
                
                        <!-- RIGHT: CHARTS BOX -->
                        <div class="member-box right-box">
                            <div id="categoryBadges"></div>

                            <div class="demo-label">Point Breakdown</div>
                
                            <div class="chart-toggle">
                                <div class="chart-toggle-track" id="chartToggleTrack">
                                    <div class="chart-toggle-knob" id="chartToggleKnob"></div>
                                    <span class="chart-toggle-option" data-mode="donut">Donut</span>
                                    <span class="chart-toggle-option" data-mode="bar">Bar</span>
                                </div>
                            </div>
                
                            <div class="chart-container">
                                <canvas id="pointsChart"></canvas>
                            </div>
                        </div>
                
                    </div>
                
                    <!-- EVENTS BOX -->
                    <div class="events-box">
                        <div class="demo-label">Events Attended</div>
                
                        <div id="eventFilters" class="event-filter-row"></div>
                
                        <div id="eventList" class="event-list">Section Coming Soon!</div>
                    </div>
                
                    <div class="demo-buttons-row" style="margin-top:1em;">
                        <button id="checkInBtn" type="button" class="demo-small-btn">Check In</button>
                    </div>
                
                    <div id="checkInMessage" class="demo-message"></div>
                
                </div>
                
                
            </section>

            <!-- leaderboard -->
            <section class="card-section soft-section leaderboard-section hidden" id="leaderboardCard">
                <div class="leaderboard-container">
                    <h2>Top 10 Leaderboard</h2>
                    <p class="leader-sub">Who's leading the points this semester - live and sorted.</p>

                    <div class="podium" id="leaderboardPodium"></div>

                    <div class="rank-list" id="leaderboardList"></div>
                </div>
            </section>

            <!-- admin mode -->
        

            <!-- attendance log -->
            
        </div>
    </section>

    <!-- footer section -->
    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
